[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Sdwire"
version = "0.1.5"
description = "Upload files to SD card using SDWire multiplexer"
authors = [
    { name = "Arkadiusz Miśkiewicz", email = "arekm@maven.pl" },
]
requires-python = ">=3,<4"
dependencies = []
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
sdwire = "octoprint_sdwire"

[project.urls]
Homepage = "https://github.com/arekm/OctoPrint-Sdwire"

[project.optional-dependencies]
develop = [
    "go-task-bin",
    "pre-commit",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_sdwire",
    "octoprint_sdwire.*",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = ["I"]
